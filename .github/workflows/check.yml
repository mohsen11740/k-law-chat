name: Validate K-Law Chat

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check src/index.js
      - run: node -e "const p=require('./package.json'); if(p.name!=='k-law-chat') process.exit(1)"
